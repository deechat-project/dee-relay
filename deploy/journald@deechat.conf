# Journald configuration for the "deechat" log namespace, referenced by
# LogNamespace=deechat in dee-relay.service.
#
# Install to /etc/systemd/journald@deechat.conf. A namespaced journald runs as
# systemd-journald@deechat.service and is started on demand by the unit that
# names it — there is nothing to enable.
#
# Why a namespace rather than the system journal: the node writes nothing to
# disk and a test fails the build if that changes, but journald does not
# inherit that property. The system journal persists captured stdout to
# /var/log/journal. Storage=volatile keeps this service's log in /run only, so
# a reboot clears it, matching the lifetime of the queues themselves.

[Journal]
Storage=volatile
RuntimeMaxUse=32M
# Rate limiting off: the node logs a handful of lines per boot. If that ever
# becomes untrue, the fix is fewer log lines, not a bigger budget.
RateLimitIntervalSec=0
RateLimitBurst=0
ForwardToSyslog=no
ForwardToWall=no
