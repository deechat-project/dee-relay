name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The toolchain is pinned, not floating: deploy/FINGERPRINTS.md records the
      # version the released digests were produced with, and GOTOOLCHAIN=local
      # stops a go.mod directive silently fetching a different one. A CI run on
      # some other Go proves less than it appears to.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          check-latest: false

      - name: Build
        env:
          GOTOOLCHAIN: local
        run: go build ./...

      - name: Vet
        env:
          GOTOOLCHAIN: local
        run: go vet ./...

      # The relay declares no third-party modules. That is a security claim (see
      # NOTICE), so it is checked rather than trusted: any require line beyond
      # the module itself fails the build.
      - name: No third-party dependencies
        env:
          GOTOOLCHAIN: local
        run: |
          deps="$(go list -m all | tail -n +2)"
          if [ -n "$deps" ]; then
            echo "unexpected module requirements:" >&2
            echo "$deps" >&2
            exit 1
          fi

      - name: Test
        env:
          GOTOOLCHAIN: local
        run: go test ./...

      # Run again alone so a failure here is unmistakable in the log: these are
      # the audits behind "this relay cannot keep your data".
      - name: Audit
        env:
          GOTOOLCHAIN: local
        run: go test -v ./internal/audit
